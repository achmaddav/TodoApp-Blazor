<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TodoApp</title>
    <base href="/" />

    <!-- MudBlazor -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />

    <style>
        .todo-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99,102,241,0.15) !important;
        }

        body {
            background-color: #F8FAFC;
        }
    </style>
</head>
<body>
    <div id="app">
        <div style="display:flex; justify-content:center;
            align-items:center; height:100vh; flex-direction:column;">
            <div style="width:48px; height:48px; border:4px solid #6366F1;
                border-top-color:transparent; border-radius:50%;
                animation:spin 1s linear infinite;"></div>
            <p style="margin-top:16px; color:#6366F1;">Loading...</p>
        </div>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>

    <style>
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</body>
</html>
